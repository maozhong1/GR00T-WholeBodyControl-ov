# G1 Deploy - Observation Configuration
# ====================================
# Total dimension: 436 (64+12+116+116+116+12)

observations:

  - name: "token_state"
    enabled: true

  - name: "his_base_angular_velocity_10frame_step1"
    enabled: true
    
  - name: "his_body_joint_positions_10frame_step1"
    enabled: true
    
  - name: "his_body_joint_velocities_10frame_step1"
    enabled: true
    
  - name: "his_last_actions_10frame_step1"
    enabled: true

  - name: "his_gravity_dir_10frame_step1"
    enabled: true

encoder:
  dimension: 64
  use_fp16: false
  encoder_observations:
    - name: "encoder_mode_4"
      enabled: true
    - name: "motion_joint_positions_10frame_step5"
      enabled: true
    - name: "motion_joint_velocities_10frame_step5"
      enabled: true
    - name: "motion_root_z_position_10frame_step5"
      enabled: true
    - name: "motion_root_z_position"
      enabled: true
    - name: "motion_anchor_orientation"
      enabled: true
    - name: "motion_anchor_orientation_10frame_step5"
      enabled: true
    - name: "motion_joint_positions_lowerbody_10frame_step5"
      enabled: true
    - name: "motion_joint_velocities_lowerbody_10frame_step5"
      enabled: true
    - name: "vr_3point_local_target"
      enabled: true
    - name: "vr_3point_local_orn_target"
      enabled: true
    - name: "smpl_joints_10frame_step1"
      enabled: true
    - name: "smpl_anchor_orientation_10frame_step1" 
      enabled: true
    - name: "motion_joint_positions_wrists_10frame_step1" 
      enabled: true
  encoder_modes:
    - name: "g1"
      mode_id: 0
      required_observations:
        - encoder_mode_4
        - motion_joint_positions_10frame_step5
        - motion_joint_velocities_10frame_step5
        - motion_anchor_orientation_10frame_step5
    - name: "teleop"
      mode_id: 1
      required_observations:
        - encoder_mode_4
        - motion_joint_positions_lowerbody_10frame_step5
        - motion_joint_velocities_lowerbody_10frame_step5
        - vr_3point_local_target
        - vr_3point_local_orn_target
        - motion_anchor_orientation
    - name: "smpl"
      mode_id: 2
      required_observations:
        - encoder_mode_4
        - smpl_joints_10frame_step1
        - smpl_anchor_orientation_10frame_step1
        - motion_joint_positions_wrists_10frame_step1

inference:
  encoder_device: "NPU"
  policy_device: "NPU"
  planner_device: "NPU"
  # NPU tile allocation per model (0=auto/driver default, 1-N=specific tile count).
  # Encoder+decoder run sequentially in the control thread — 1 tile each is sufficient.
  # Planner runs in a separate thread — can use more tiles for throughput.
  encoder_npu_tiles: 1
  policy_npu_tiles: 1
  planner_npu_tiles: 0
  # Pin the inference/control thread to a specific CPU core to reduce latency jitter.
  # Set to -1 to disable pinning (default), or a core number (e.g., 10) to pin.
  # Here 10 is one of isolated core, dedicated for inference.
  # use 'echo 10 | sudo tee /proc/irq/189/smp_affinity_list' to set vpu interrupt affitiy
  # to reduce jitter in case NPU sync inference.
  cpu_affinity: 10
  # Dump planner model inputs to CSV for NPU accuracy validation.
  # Set to true to enable, max_input_dump_cnt limits the number of rows (0 = unlimited).
  dump_planner_input: flase
  max_input_dump_cnt: 200
  dump_csv_path: "planner_input_dump.csv"
